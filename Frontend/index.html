<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SnapStudy AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>SnapStudy AI</h1>

    <p class="subtitle">
        Your lightweight AI study assistant
    </p>

    <textarea
            id="studyText"
            placeholder="Paste your study material here..."
    ></textarea>

    <button id="summarizeBtn">
        Summarize
    </button>

    <div class="result">
        <h2>Summary</h2>
        <p id="summary">
            Your AI-generated summary will appear here.
        </p>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
